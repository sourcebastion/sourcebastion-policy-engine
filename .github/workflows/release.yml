name: draft-policy-engine-release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build, test and verify golden output
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sourcebastion-policy-engine") | .version')
          test "${GITHUB_REF_NAME}" = "v${crate_version}"
          cargo test --locked
          cargo build --release --locked
          target/release/sourcebastion-policy evaluate < examples/clean.json > result.json
          cmp examples/clean.expected.json result.json
      - name: Generate CycloneDX SBOM with pinned tool
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --spec-version 1.5 --override-filename "sourcebastion-policy-sbom-${{ matrix.architecture }}"
      - name: Package architecture artifacts
        run: |
          mkdir -p dist
          cp target/release/sourcebastion-policy "dist/sourcebastion-policy-linux-${{ matrix.architecture }}"
          mv "sourcebastion-policy-sbom-${{ matrix.architecture }}.json" dist/
          sha256sum "dist/sourcebastion-policy-linux-${{ matrix.architecture }}" "dist/sourcebastion-policy-sbom-${{ matrix.architecture }}.json" > "dist/SHA256SUMS-${{ matrix.architecture }}"
          sha256sum -c "dist/SHA256SUMS-${{ matrix.architecture }}"
      - name: Upload architecture artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sourcebastion-policy-${{ matrix.architecture }}
          path: dist/
          if-no-files-found: error

  draft-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sourcebastion-policy-*
          path: dist
          merge-multiple: true
      - name: Add source package and notices
        run: |
          cargo package --locked
          cp target/package/sourcebastion-policy-engine-*.crate dist/
          cp LICENSE NOTICE.md licenses/CEDAR-APACHE-2.0.txt dist/
          sha256sum -c dist/SHA256SUMS-amd64
          sha256sum -c dist/SHA256SUMS-arm64
          sha256sum dist/*.crate dist/LICENSE dist/NOTICE.md dist/CEDAR-APACHE-2.0.txt > dist/SHA256SUMS-source
      - name: Create draft for reviewer approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --draft --title "SourceBastion Policy Engine ${GITHUB_REF_NAME}" --notes "Standalone offline Cedar engine. Review checksums, CycloneDX SBOMs, license notices, scanner adapter proof and rollback evidence before publishing. This draft does not cut over the Action or hosted platform."
